[project]
name = "mcp-vroid"
version = "0.1.0"
description = "MCP server that drives the VRoid Studio GUI on Hyprland/Wayland (screenshot -> OCR -> synthetic input)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuri Hodges" }]
keywords = ["mcp", "vroid", "vrm", "gui-automation", "hyprland", "wayland"]
classifiers = [
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "python-xlib>=0.33",
]

[project.scripts]
mcp-vroid = "mcp_vroid.server:main"
vroid-driver = "mcp_vroid.driver.cli:main"

[project.urls]
Homepage = "https://github.com/nhodges/mcp-vroid"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vroid"]
