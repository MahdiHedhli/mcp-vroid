[project]
name = "mcp-vroid"
version = "0.1.0"
description = "Drive VRoid Studio from any MCP client - GUI automation with OCR (Wayland + macOS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuri Hodges" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "vroid",
    "vrm",
    "gui-automation",
    "hyprland",
    "wayland",
    "macos",
    "3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
mcp-vroid = "mcp_vroid.server:main"
vroid-driver = "mcp_vroid.driver.cli:main"

[project.urls]
Homepage = "https://github.com/nhodges/mcp-vroid"
Repository = "https://github.com/nhodges/mcp-vroid"
Issues = "https://github.com/nhodges/mcp-vroid/issues"
Changelog = "https://github.com/nhodges/mcp-vroid/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vroid"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
